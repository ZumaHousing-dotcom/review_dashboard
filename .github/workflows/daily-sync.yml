name: Daily review sync

# Pulls the newest Google and Yelp reviews and adds any new ones to Supabase (ri_reviews).
# AppFolio survey data already reaches Supabase through your own pipeline, so it is not touched here.
on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC
  workflow_dispatch: {}      # lets you press "Run workflow" by hand

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch newest Google and Yelp reviews (1 page each keeps SerpApi use low)
        run: python reviews_sync.py --sources google,yelp --google-pages 1 --yelp-pages 1 --out reviews.json
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_PLACE_ID: ${{ secrets.SERPAPI_PLACE_ID }}
          YELP_BUSINESS_ID: ${{ secrets.YELP_BUSINESS_ID }}
      - name: Add new reviews to Supabase
        run: python reviews_sync.py --push-reviews --out reviews.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
